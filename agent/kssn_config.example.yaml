# ISOCHRON Proposer Agent Configuration
# Copy this file to kssn_config.yaml and customize for your setup

# L1 RPC endpoint (Ethereum mainnet or testnet)
l1_rpc: "http://localhost:8545"

# SharedSequencerHub contract address on L1
hub_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"

# This proposer's address (must be registered in ProposerRegistry)
proposer_address: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"

# Private key for signing rotateNetwork() transaction
# IMPORTANT: Keep this secure! Use environment variables in production.
private_key: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"

# Polling interval in seconds (approximately 1 L1 block)
poll_interval: 12

# OP Stack service admin URLs
op_node_admin_url: "http://localhost:7545"
op_batcher_admin_url: "http://localhost:7546"

# Active Handoff Configuration
# Start handoff sequence this many seconds before epoch ends
handoff_lead_time: 60

# Maximum time to wait for batch flush during handoff (seconds)
flush_timeout: 300
