[package]
name = "isochron-relay"
version = "0.1.0"
edition = "2021"
description = "ISOCHRON Universal Sequencing Relay - time-sensitive cross-chain bundle processing"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ethereum types and ABI
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"

# HTTP server for relay API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Cryptography
sha3 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"

# Time
chrono = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
